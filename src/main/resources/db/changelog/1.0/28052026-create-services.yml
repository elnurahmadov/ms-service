databaseChangeLog:
  - changeSet:
      id: create-services
      author: elnur.ahmadov
      changes:
        - createTable:
            tableName: services
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: display_text_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: services_group_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: service_code
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: description_applicable
                  type: BOOLEAN
                  defaultValueBoolean: false
                  remarks: True if service description is applicable
                  constraints:
                    nullable: false
              - column:
                  name: action_applicable
                  type: BOOLEAN
                  defaultValueBoolean: false
                  remarks: True if service actions is applicable
                  constraints:
                    nullable: false
              - column:
                  name: rate_applicable
                  type: BOOLEAN
                  defaultValueBoolean: false
                  remarks: True if service form or termination rate is applicable
                  constraints:
                    nullable: false
              - column:
                  name: tooltips_applicable
                  type: BOOLEAN
                  defaultValueBoolean: false
                  remarks: True if service tooltips is applicable
                  constraints:
                    nullable: false
              - column:
                  name: report_applicable
                  type: BOOLEAN
                  defaultValueBoolean: false
                  remarks: True if service report is applicable
                  constraints:
                    nullable: false
              - column:
                  name: restriction_applicable
                  type: BOOLEAN
                  defaultValueBoolean: false
                  remarks: True if service restriction is applicable
                  constraints:
                    nullable: false
              - column:
                  name: service_type
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValue: now()
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValue: now()

        - addForeignKeyConstraint:
            baseTableName: services
            baseColumnNames: display_text_id
            referencedTableName: display_text
            referencedColumnNames: id
            constraintName: fk_services_display_text
            onDelete: RESTRICT
        - addForeignKeyConstraint:
            baseTableName: services
            baseColumnNames: services_group_id
            referencedTableName: services_group
            referencedColumnNames: id
            constraintName: fk_services_services_group
            onDelete: RESTRICT