databaseChangeLog:
  - changeSet:
      id: create-services_group
      author: elnur.ahmadov
      changes:
        - createTable:
            tableName: services_group
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: display_text_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValue: now()
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValue: now()
        - addForeignKeyConstraint:
            baseTableName: services_group
            baseColumnNames: display_text_id
            referencedTableName: display_text
            referencedColumnNames: id
            constraintName: fk_services_group_display_text_id
            onDelete: RESTRICT
            onUpdate: CASCADE